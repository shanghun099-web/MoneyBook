<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>젬의 스마트 가계부</title>
<meta name="theme-color" content="#F2F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F2F4F6;--card:#FFFFFF;--text:#191F28;--sub:#6B7684;--dim:#9AA3AE;--line:#EEF0F3;
  --soft:#F2F4F6;--soft2:#E5E8EC;--accent:#3E63F2;--accent-soft:#ECF0FF;
  --pos:#0F9D76;--pos-soft:#E5F6F0;--neg:#E5484D;--neg-soft:#FDEDED;--warn:#D9820B;--warn-soft:#FFF3DE;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);--dimmer:rgba(15,18,25,.45);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101215;--card:#1A1D22;--text:#ECEEF1;--sub:#9AA1AC;--dim:#6C737E;--line:#262A31;
  --soft:#23272E;--soft2:#30353D;--accent:#6E8BFF;--accent-soft:#232B45;
  --pos:#34C79A;--pos-soft:#17312A;--neg:#FF6B6F;--neg-soft:#3A1F22;--warn:#F2A93B;--warn-soft:#3A2D16;
  --shadow:none;--dimmer:rgba(0,0,0,.6);color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101215;--card:#1A1D22;--text:#ECEEF1;--sub:#9AA1AC;--dim:#6C737E;--line:#262A31;
    --soft:#23272E;--soft2:#30353D;--accent:#6E8BFF;--accent-soft:#232B45;
    --pos:#34C79A;--pos-soft:#17312A;--neg:#FF6B6F;--neg-soft:#3A1F22;--warn:#F2A93B;--warn-soft:#3A2D16;
    --shadow:none;--dimmer:rgba(0,0,0,.6);color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* 위쪽 바 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 0 6px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.month{display:flex;align-items:center;gap:2px}
.month b{font-size:20px;font-weight:800;letter-spacing:-.5px;padding:0 4px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:0;background:transparent;color:var(--sub);position:relative}
.icon-btn:active{background:var(--soft2)}
.icon-btn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.top-r{display:flex;gap:2px}

/* 카드 */
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-top:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.card-h h2{font-size:16.5px;font-weight:700;letter-spacing:-.3px}
.card-h .more{font-size:13.5px;color:var(--sub);background:none;border:0;padding:6px 0 6px 8px;font-weight:600}
.lbl{font-size:13.5px;color:var(--sub);font-weight:600}
.big{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin-top:2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.split>div{background:var(--soft);border-radius:14px;padding:12px 14px}
.split .l{font-size:12.5px;color:var(--sub);font-weight:600}
.split .v{font-size:17px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.pend{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:11px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:13.5px;font-weight:700}
.bar{height:8px;background:var(--soft2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
.bar-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:8px;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.sub{color:var(--sub)}

/* 목록 줄 */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;background:none;border:0;text-align:left}
.ava{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.row .main{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-size:15px;font-weight:700;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-size:12px;color:var(--sub);font-weight:500}
.row.done .t{color:var(--dim);text-decoration:line-through}
.row.done .amt{color:var(--dim)}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);font-weight:600;padding:14px 0 4px}
.day-h:first-child{padding-top:0}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:22px 0}

.chip{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:99px;border:0;background:var(--soft);color:var(--sub);white-space:nowrap;flex-shrink:0}
.chip.acc{background:var(--accent);color:#fff}
.chip.ok{background:var(--pos-soft);color:var(--pos)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--soft2);display:grid;place-items:center;background:transparent;flex-shrink:0;color:#fff}
.check.on{background:var(--accent);border-color:var(--accent)}

.btn{height:50px;border-radius:14px;border:0;font-size:15.5px;font-weight:700;padding:0 18px;background:var(--soft);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{filter:brightness(.95)}
.btn.pri{background:var(--accent);color:#fff}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.block{width:100%}
.btn.sm{height:38px;font-size:13.5px;border-radius:11px;padding:0 13px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;margin-top:18px}
.btns .btn{flex:1}

.nudge{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px 16px;margin-top:12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.nudge .t{font-size:14px;font-weight:700}
.nudge .s{font-size:12.5px;color:var(--sub)}

/* 아래 탭 */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:64px;align-items:center}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--dim);height:100%}
.tabbar button.on{color:var(--text)}
.tabbar .add{width:52px;height:52px;border-radius:18px;background:var(--accent);color:#fff;justify-self:center;align-self:center;height:52px}

/* 입력 */
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--card)}
textarea{resize:vertical;line-height:1.5}
select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field{margin-top:16px}
.field>label{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.amt-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:4px 0}
.amt-wrap:focus-within{border-color:var(--accent)}
.amt-in{font-size:30px;font-weight:800;letter-spacing:-.8px;background:transparent!important;border:0!important;padding:4px 0;border-radius:0}
.amt-wrap span{font-size:20px;font-weight:700;color:var(--sub)}
.quick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:13px;padding:4px;gap:4px}
.seg button{height:38px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--sub);font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{border:1.5px solid transparent;background:var(--soft);border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--sub)}
.cats button b{font-size:20px;font-weight:400}
.cats button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.hint{font-size:13px;color:var(--sub);line-height:1.55}
.search{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search input{height:44px;padding:0 14px}

/* 바텀 시트 */
.sheet-bg{position:fixed;inset:0;background:var(--dimmer);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-bg.show{opacity:1}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;max-height:92vh;overflow-y:auto;padding:6px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.show .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--soft2);margin:6px auto 16px}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.5px}
.sheet .desc{font-size:13.5px;color:var(--sub);margin-top:4px}
.dialog-bg{align-items:center;padding:20px}
.dialog-bg .sheet{border-radius:24px;max-width:380px;padding:24px 20px 18px;transform:scale(.96)}

/* 문자 읽기 결과 */
.sms-item{background:var(--soft);border-radius:16px;padding:12px;margin-top:8px}
.sms-item.off{opacity:.5}
.sms-top{display:flex;align-items:center;gap:10px}
.sms-top input[type=text]{background:var(--card);padding:9px 11px;font-size:15px;font-weight:600}
.sms-grid{display:grid;grid-template-columns:.9fr 1.25fr 1.05fr;gap:6px;margin-top:8px}
.sms-grid input,.sms-grid select{background-color:var(--card);padding:9px 8px;font-size:14px;min-width:0}
.sms-grid select{padding-right:22px;background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%}
.sms-tag{font-size:11.5px;font-weight:700;margin-top:6px}

/* 설정 */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .t{font-size:15px;font-weight:600}
.set-row .s{font-size:12.5px;color:var(--sub);margin-top:1px}
.switch{width:50px;height:30px;border-radius:99px;background:var(--soft2);border:0;position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.mini-in{width:84px;text-align:center;padding:9px 8px}
.steps{padding-left:20px;margin-top:12px;font-size:14px;line-height:1.7}
.steps li{margin-bottom:6px}
.steps b{font-weight:700}
.status{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:13.5px;font-weight:600;margin-bottom:4px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--dim);flex-shrink:0}
.status.ok i{background:var(--pos)}.status.warn i{background:var(--warn)}
.foot{text-align:center;color:var(--dim);font-size:12px;padding:22px 0 8px}

/* 잠금 화면 */
.lock{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px calc(24px + env(safe-area-inset-bottom))}
.lock img{width:64px;height:64px;border-radius:18px;box-shadow:var(--shadow)}
.lock h2{font-size:20px;font-weight:800;margin-top:18px;letter-spacing:-.4px}
.lock p{font-size:14px;color:var(--sub);margin-top:4px;text-align:center}
.dots{display:flex;gap:16px;margin:28px 0 36px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--soft2);transition:all .15s}
.dots i.on{background:var(--accent);transform:scale(1.1)}
.dots.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px}
.pad button{height:76px;border-radius:50%;border:0;background:transparent;font-size:28px;font-weight:600;color:var(--text)}
.pad button:active{background:var(--soft2)}
.lock .skip{margin-top:22px;background:none;border:0;color:var(--sub);font-size:14px;font-weight:600;padding:10px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1F232A;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:90;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.legend-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.legend-row i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-row .n{flex:1;font-weight:600}
.legend-row .p{color:var(--sub);font-size:13px;width:38px;text-align:right}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="month">
    <button class="icon-btn" data-act="prevM" aria-label="이전 달"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <b id="monthLabel" class="num">2026년 10월</b>
    <button class="icon-btn" data-act="nextM" aria-label="다음 달"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="top-r">
    <button class="icon-btn" data-act="bkQuick" id="bkBtn" aria-label="드라이브 백업"></button>
    <button class="icon-btn" data-act="lock" aria-label="잠금"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  </div>
</div></div>

<main class="wrap" id="view"></main>

<nav class="tabbar"><div class="in" id="tabbar"></div></nav>

<div class="lock hidden" id="lock"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">

<script>
'use strict';
/* ================= 기본 설정 ================= */
const APP = 'gem_smart_budget_pro';
const K = {
  fe: `${APP}_fixed_expenses`, tx: `${APP}_transactions`, pw: `${APP}_app_password`, budget: `${APP}_monthly_budget`,
  rules: 'mb_rules_v1', settle: 'mb_settle_v1', bk: 'mb_bk_v1', theme: 'mb_theme', pinSkip: 'mb_pin_skip'
};
const DEFAULT_FIXED = [
  { id: 'fe-1', name: '예본 렌트카 비용', amount: 500000, day: 15 },
  { id: 'fe-2', name: '국민연금 건강보험', amount: 300000, day: 10 },
  { id: 'fe-3', name: '통신요금', amount: 45000, day: 9 },
  { id: 'fe-4', name: '예본 세무비용', amount: 110000, day: 31 },
  { id: 'fe-5', name: '우리은행 전세자금 대출이자', amount: 480000, day: 5 },
  { id: 'fe-6', name: '은행적금 (가비/새람)', amount: 100000, day: 20 },
  { id: 'fe-7', name: '수진이 교회헌금', amount: 50000, day: 20 },
  { id: 'fe-8', name: '기업은행 대출', amount: 350000, day: 24 }
];
const CATS = {
  income: ['주수입', '부수입', '보너스', '기타수입'],
  expense: ['식비', '차량/주유', '교통비', '생활용품', '쇼핑/문화', '경조사', '고정비', '기타지출']
};
const CAT_ICON = { '주수입': '💼', '부수입': '🪙', '보너스': '🎁', '기타수입': '💵', '고정비': '📌', '식비': '🍚', '차량/주유': '⛽', '교통비': '🚌', '쇼핑/문화': '🛍️', '생활용품': '🧴', '경조사': '💐', '기타지출': '🧾' };
const COLORS = ['#3E63F2', '#0F9D76', '#F2A93B', '#E5484D', '#8B5CF6', '#06B6D4', '#EC4899', '#94A3B8'];

/* ================= 저장소 ================= */
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  json(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { toast('저장 공간이 부족해요. 백업 후 정리해 주세요'); return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const clone = (o) => JSON.parse(JSON.stringify(o));

const S = {
  fe: ls.json(K.fe, null) || clone(DEFAULT_FIXED),
  tx: ls.json(K.tx, []),
  pw: ls.get(K.pw, ''),
  budget: parseInt(ls.get(K.budget, '0'), 10) || 0,
  rules: ls.json(K.rules, {}),
  settle: Object.assign({ on: true, oneDay: 25, dlDay: 31, tax: true }, ls.json(K.settle, {})),
  bk: Object.assign({ url: '', auto: true, lastAt: 0, hash: '', lastErr: '' }, ls.json(K.bk, {})),
  theme: ls.get(K.theme, 'auto'),
  month: '', tab: 'home', q: '', ftype: 'all',
  locked: false, pin: '', setup: 0, tmpPin: '', oldPw: ''
};
if (!Array.isArray(S.tx)) S.tx = [];
if (!Array.isArray(S.fe)) S.fe = clone(DEFAULT_FIXED);

function saveTx() { ls.set(K.tx, JSON.stringify(S.tx)); dirty(); }
function saveFe() { ls.set(K.fe, JSON.stringify(S.fe)); dirty(); }
function saveBudget() { ls.set(K.budget, String(S.budget)); dirty(); }
function saveRules() { ls.set(K.rules, JSON.stringify(S.rules)); dirty(); }
function saveSettle() { ls.set(K.settle, JSON.stringify(S.settle)); dirty(); }
function saveBk() { ls.set(K.bk, JSON.stringify(S.bk)); }

/* ================= 유틸 ================= */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
function tdy() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function curMonth() { return tdy().slice(0, 7); }
function monthAdd(m, n) { let [y, mo] = m.split('-').map(Number); mo += n; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return `${y}-${pad(mo)}`; }
function lastDay(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
function dayIn(day, m) { const L = lastDay(m); return day >= 31 ? L : Math.min(day, L); }
function mNum(m) { return parseInt(m.split('-')[1], 10); }
function fmtDay(d) { const x = new Date(d + 'T00:00:00'); return `${x.getMonth() + 1}월 ${x.getDate()}일 (${DAYS[x.getDay()]})`; }
function won(n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function digits(s) { return parseInt(String(s || '').replace(/[^\d]/g, ''), 10) || 0; }
function hashStr(t) { let h = 5381; for (let i = 0; i < t.length; i++) h = (h * 33 + t.charCodeAt(i)) | 0; return t.length + ':' + h; }
function ago(ts) {
  if (!ts) return '아직 없음';
  const s = (Date.now() - ts) / 1000;
  if (s < 90) return '방금 전';
  if (s < 3600) return `${Math.round(s / 60)}분 전`;
  if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
  return `${Math.floor(s / 86400)}일 전`;
}

function openSheet(html, mount, opts = {}) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg' + (opts.dialog ? ' dialog-bg' : '');
  bg.innerHTML = `<div class="sheet">${opts.dialog ? '' : '<div class="grab"></div>'}${html}</div>`;
  document.body.appendChild(bg);
  document.body.style.overflow = 'hidden';
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    if (opts.onClose) opts.onClose();
    bg.classList.remove('show');
    setTimeout(() => { bg.remove(); if (!document.querySelector('.sheet-bg')) document.body.style.overflow = ''; }, 200);
  };
  bg.addEventListener('click', (e) => { if (e.target === bg) close(); });
  requestAnimationFrame(() => bg.classList.add('show'));
  if (mount) mount(bg.querySelector('.sheet'), close);
  return close;
}
function ask(title, msg, ok = '확인', danger = false) {
  return new Promise((resolve) => {
    let answer = false;
    openSheet(`
      <h3>${esc(title)}</h3><p class="desc" style="line-height:1.55">${esc(msg)}</p>
      <div class="btns"><button class="btn" data-a="no">취소</button><button class="btn ${danger ? 'danger' : 'pri'}" data-a="yes">${esc(ok)}</button></div>`,
      (el, cl) => {
        el.querySelector('[data-a=no]').onclick = cl;
        el.querySelector('[data-a=yes]').onclick = () => { answer = true; cl(); };
      }, { dialog: true, onClose: () => resolve(answer) });
  });
}

function monthTx(m) { return S.tx.filter(t => String(t.date || '').startsWith(m)); }
function totals(list) {
  let inc = 0, exp = 0, fixed = 0;
  list.forEach(t => {
    if (t.type === 'income') inc += t.amount;
    else { exp += t.amount; if (t.category === '고정비' || t.fixedExpenseId) fixed += t.amount; }
  });
  return { inc, exp, fixed, variable: exp - fixed };
}
function sortTx(list) { return list.slice().sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id))); }

/* ---------- 배송 정산 (smile001 기록 읽기) ----------
   smile001 과 같은 github.io 주소라 같은 저장소(localStorage)를 쓴다.
   이번 달에 들어오는 돈 = 지난달 배송분. 이름에 '딜'이 들어간 물품은 딜리, 나머지는 오네 */
const DLV_TAX = 0.033;
const DLV_NAME = { A: '오네', B: '오네 책', C: '딜리', D: '물품 D', E: '물품 E', F: '물품 F', G: '물품 G', H: '물품 H' };
const DLV_PRICE = { A: 1400, B: 1200, C: 1200, D: 1000, E: 1000, F: 1000, G: 1000, H: 1000 };
const settleId = (key, m) => `t-settle-${key}-${m}`;
function dlvItems() {
  return Object.keys(DLV_NAME).map(k => ({
    k, name: String(ls.get('name-' + k, '') || '').trim() || DLV_NAME[k],
    price: Number(ls.get('price-' + k, 0)) || DLV_PRICE[k]
  }));
}
function dlvRecords() { const r = ls.json('dlv-v4', null); return Array.isArray(r) ? r : null; }
function settleFor(month) {
  if (!S.settle.on) return null;
  const work = monthAdd(month, -1);
  const recs = dlvRecords();
  const items = dlvItems();
  const g = { one: { gross: 0, qty: 0, days: 0 }, dl: { gross: 0, qty: 0, days: 0 } };
  (recs || []).filter(r => r && String(r.date || '').startsWith(work)).forEach(r => {
    const hit = { one: false, dl: false };
    items.forEach(it => {
      const q = Number(r['qty' + it.k]) || 0;
      if (!q) return;
      const rv = r.rates && r.rates[it.k] !== undefined && r.rates[it.k] !== null && r.rates[it.k] !== '' ? Number(r.rates[it.k]) : it.price;
      const key = /딜/.test(it.name) ? 'dl' : 'one';
      g[key].gross += q * rv; g[key].qty += q; hit[key] = true;
    });
    if (hit.one) g.one.days++;
    if (hit.dl) g.dl.days++;
  });
  const defs = [
    { key: 'one', name: '오네 정산', day: dayIn(S.settle.oneDay, month) },
    { key: 'dl', name: '딜리 정산', day: dayIn(S.settle.dlDay, month) }
  ];
  const rows = defs.map(d => {
    const x = g[d.key];
    const net = S.settle.tax ? Math.round(x.gross * (1 - DLV_TAX)) : x.gross;
    const tx = S.tx.find(t => t.id === settleId(d.key, month));
    return { ...d, ...x, net, tx, date: `${month}-${pad(d.day)}` };
  }).filter(r => r.qty > 0 || r.tx);
  return { found: !!recs, work, rows, pending: rows.filter(r => !r.tx).reduce((s, r) => s + r.net, 0) };
}

const ruleKey = (desc) => String(desc || '').trim().split(/\s+/)[0].toLowerCase();
function guessCat(desc, type, noRules) {
  const r = noRules ? null : S.rules[ruleKey(desc)];
  if (r && CATS[type].includes(r)) return r;
  if (type === 'income') return /급여|월급|정산|대한통운|딜리|오네/.test(desc) ? '주수입' : '기타수입';

/* ---------- 카드·은행 문자 읽기 ---------- */
const CARD_RE = /(신한|KB국민|KB|국민|삼성|현대|롯데|하나|우리|BC|비씨|NH농협|농협|씨티|카카오뱅크|카카오페이|토스|케이뱅크|IBK|기업|SC제일|새마을|우체국|신협)/;
function cleanMerchant(s) {
  return String(s || '')
    .replace(/(누적|잔액|잔고|사용가능|가능한도|한도|포인트).*$/, '')
    .replace(/\d{1,3}(?:,\d{3})+\s*원?|\d+\s*원/g, ' ')
    .replace(/\(?일시불\)?|\(?\d+\s*개월\)?|할부/g, ' ')
    .replace(/\d+\*+\d*|\*+\d+/g, ' ')
    .replace(/입금|출금|이체|승인|결제|체크|취소|사용/g, ' ')
    .replace(/[\[\]()]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 30);
}
function parseOne(msg) {
  const one = msg.replace(/\[Web발신\]/g, ' ').replace(/\s+/g, ' ').trim();
  let amount = 0, m;
  const re = /(누적|잔액|잔고|한도|잔여|포인트)?\s*:?\s*(\d{1,3}(?:,\d{3})+|\d+)\s*원/g;
  while ((m = re.exec(one))) { if (m[1]) continue; amount = +m[2].replace(/,/g, ''); if (amount > 0) break; }
  if (!amount) { const b = one.match(/(입금|출금|지급|이체)\s*:?\s*(\d{1,3}(?:,\d{3})+|\d+)/); if (b) amount = +b[2].replace(/,/g, ''); }
  if (!amount) return null;
  const cancel = /취소|거절/.test(one);
  const type = /입금|환급|급여|지급/.test(one) && !/출금|승인|결제/.test(one) ? 'income' : 'expense';
  let date = tdy();
  const dm = one.match(/(?:^|[^\d,])(\d{1,2})[\/.월-]\s?(\d{1,2})일?(?:\s*(\d{1,2}):(\d{2}))?/);
  if (dm) {
    const mo = +dm[1], d = +dm[2];
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
      const now = new Date(); let y = now.getFullYear();
      if (mo > now.getMonth() + 2) y--;
      date = `${y}-${pad(mo)}-${pad(d)}`;
    }
  }
  let merchant = dm ? cleanMerchant(one.slice(dm.index + dm[0].length)) : '';
  if (!merchant) {
    const lines = msg.replace(/\[Web발신\]/g, '').split('\n').map(s => s.trim()).filter(Boolean);
    const cand = lines.filter(l => !/\d[\d,]*\s*원|누적|잔액|승인|일시불|할부|\d{1,2}[\/.]\d{1,2}|카드|체크|님$|\*/.test(l));
    merchant = cleanMerchant(cand[cand.length - 1] || '');
  }
  const card = (one.match(CARD_RE) || [])[1] || '';
  if (!merchant) merchant = `${card ? card + ' ' : ''}${type === 'income' ? '입금' : '카드 결제'}`;
  return { amount, type, date, merchant, cancel, card };
}
function parseSms(text) {
  const raw = String(text || '').replace(/\r/g, '').trim();
  if (!raw) return [];
  return raw.split(/\n\s*\n|(?=\[Web발신\])/).map(s => s.trim()).filter(Boolean).map(parseOne).filter(Boolean);
}
const isDup = (p) => S.tx.some(t => t.date === p.date && t.amount === p.amount && t.type === p.type && (t.description === p.merchant || t.smsKey === `${p.date}|${p.amount}|${p.merchant}`));

    return `<div class="row ${on ? 'done' : ''}">

  }).join('') : `<div class="empty">설정에서 고정 지출을 추가해 보세요</div>`;

  return h;
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawCharts() {
  if (typeof Chart === 'undefined') return;
  const sub = cssVar('--sub'), line = cssVar('--line'), card = cssVar('--card');
  Chart.defaults.font.family = 'Pretendard, sans-serif';
  Chart.defaults.color = sub;
  const list = monthTx(S.month), map = {};
  list.forEach(t => { if (t.type === 'expense') map[t.category] = (map[t.category] || 0) + t.amount; });
  const cats = Object.entries(map).sort((a, b) => b[1] - a[1]);
  if ($('cDonut') && cats.length) {
    charts.push(new Chart($('cDonut'), {
      type: 'doughnut',
      data: { labels: cats.map(c => c[0]), datasets: [{ data: cats.map(c => c[1]), backgroundColor: cats.map((_, i) => COLORS[i % COLORS.length]), borderColor: card, borderWidth: 3 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.label}: ${won(c.raw)}` } } } }
    }));
  }
  const months = []; for (let i = 5; i >= 0; i--) months.push(monthAdd(S.month, -i));
  const inc = months.map(mm => totals(monthTx(mm)).inc), exp = months.map(mm => totals(monthTx(mm)).exp);
  charts.push(new Chart($('cTrend'), {
    type: 'bar',
    data: { labels: months.map(mm => mNum(mm) + '월'), datasets: [
      { label: '수입', data: inc, backgroundColor: cssVar('--pos'), borderRadius: 6, maxBarThickness: 18 },
      { label: '지출', data: exp, backgroundColor: cssVar('--accent'), borderRadius: 6, maxBarThickness: 18 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 3 } }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${won(c.raw)}` } } },
      scales: { x: { grid: { display: false } }, y: { grid: { color: line }, border: { display: false }, ticks: { callback: (v) => v >= 10000 ? (v / 10000) + '만' : v } } } }
  }));
}

/* ================= 기록 입력 시트 ================= */
function openTxSheet(tx, mode = 'manual') {
  const edit = !!tx;
  const st = { type: tx ? tx.type : 'expense', cat: tx ? tx.category : '', catTouched: !!tx, mode };
  const head = edit ? `<h3>내역 고치기</h3>` :
    `<div class="seg" id="modeSeg"><button data-m="manual">직접 입력</button><button data-m="sms">문자 붙여넣기</button></div>`;
  openSheet(head + `<div id="txBody"></div>`, (el, close) => {
    const body = el.querySelector('#txBody');
    const paint = () => {
      el.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === st.mode));
      if (st.mode === 'sms') return paintSms(body, close);
      body.innerHTML = `
        <div class="seg" style="margin-top:${edit ? 14 : 16}px" id="typeSeg"><button data-t="expense">지출</button><button data-t="income">수입</button></div>
        <div class="field"><label>금액</label><div class="amt-wrap"><input id="fAmt" class="amt-in num" inputmode="numeric" placeholder="0" value="${tx ? tx.amount.toLocaleString() : ''}" autocomplete="off"><span>원</span></div>
          <div class="quick">${[10000, 50000, 100000].map(v => `<button class="chip" data-add="${v}">+${v / 10000}만</button>`).join('')}<button class="chip" data-add="0">지우기</button></div></div>
        <div class="field"><label>내용</label><input id="fDesc" placeholder="예: 점심, GS25, 주유" value="${tx ? esc(tx.description) : ''}" autocomplete="off"></div>
        <div class="field"><label>분류</label><div class="cats" id="fCats"></div></div>
        <div class="field"><label>날짜</label><input id="fDate" type="date" value="${tx ? tx.date : (S.month === curMonth() ? tdy() : S.month + '-01')}"></div>
        <div class="btns">${edit ? '<button class="btn danger" id="fDel" style="flex:0 0 96px">삭제</button>' : ''}<button class="btn pri" id="fSave">${edit ? '저장' : '기록하기'}</button></div>`;
      const paintType = () => {
        body.querySelectorAll('#typeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === st.type));
        if (!CATS[st.type].includes(st.cat)) st.cat = guessCat($('fDesc').value, st.type);
        body.querySelector('#fCats').innerHTML = CATS[st.type].map(c => `<button data-c="${c}" class="${c === st.cat ? 'on' : ''}"><b>${CAT_ICON[c]}</b>${c}</button>`).join('');
      };
      body.querySelectorAll('#typeSeg button').forEach(b => b.onclick = () => { st.type = b.dataset.t; if (!st.catTouched) st.cat = ''; paintType(); });
      body.querySelector('#fCats').onclick = (e) => { const b = e.target.closest('[data-c]'); if (!b) return; st.cat = b.dataset.c; st.catTouched = true; paintType(); };
      const amt = $('fAmt');
      amt.oninput = () => { const n = digits(amt.value); amt.value = n ? n.toLocaleString() : ''; };
      body.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const a = +b.dataset.add; const n = a ? digits(amt.value) + a : 0; amt.value = n ? n.toLocaleString() : ''; });
      $('fDesc').oninput = () => { if (!st.catTouched) { st.cat = guessCat($('fDesc').value, st.type); paintType(); } };
      paintType();
      if (!edit) setTimeout(() => amt.focus(), 250);
      $('fSave').onclick = () => {
        const amount = digits(amt.value), desc = $('fDesc').value.trim(), date = $('fDate').value;
        if (!amount) return toast('금액을 넣어 주세요');
        if (!date) return toast('날짜를 골라 주세요');
        const rec = { type: st.type, category: st.cat, amount, date, description: desc || st.cat };
        if (edit) {
          Object.assign(tx, rec);
          toast('고쳤어요');
        } else {
          S.tx.unshift({ id: `t-${Date.now()}`, ...rec });
          toast('기록했어요');
        }
        if (desc && st.catTouched && guessCat(desc, st.type) !== st.cat) {
          if (guessCat(desc, st.type, true) === st.cat) delete S.rules[ruleKey(desc)]; else S.rules[ruleKey(desc)] = st.cat;
          saveRules();
        }
        saveTx(); close(); render();
      };
      if (edit) $('fDel').onclick = async () => {
        if (!(await ask('이 내역을 지울까요?', `${tx.description} · ${won(tx.amount)}`, '지우기', true))) return;
        S.tx = S.tx.filter(t => t !== tx); saveTx(); close(); render(); toast('지웠어요');
      };
    };
    el.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { st.mode = b.dataset.m; paint(); });
    paint();
  });
}

function paintSms(body, close) {
  body.innerHTML = `
    <p class="hint" style="margin-top:14px">카드·은행 문자를 길게 눌러 <b>복사</b>한 뒤 아래에 붙여넣어 주세요. 여러 개를 한 번에 붙여도 돼요.</p>
    <textarea id="smsIn" rows="4" style="margin-top:10px" placeholder="[Web발신]&#10;신한카드(1234)승인 홍*동 12,500원(일시불)10/02 13:25 GS25 일원점"></textarea>
    <button class="btn block sm" id="smsClip" style="margin-top:8px">📋 복사한 문자 바로 붙여넣기</button>
    <div id="smsOut"></div>`;
  let items = [];
  const out = body.querySelector('#smsOut'), inp = body.querySelector('#smsIn');
  const draw = () => {
    if (!inp.value.trim()) { out.innerHTML = ''; return; }
    if (!items.length) { out.innerHTML = `<div class="empty">금액을 찾지 못했어요. 문자 내용을 그대로 붙여넣었는지 확인해 주세요.</div>`; return; }
    const n = items.filter(x => x.on).length;
    out.innerHTML = items.map((x, i) => `
      <div class="sms-item ${x.on ? '' : 'off'}" data-i="${i}">
        <div class="sms-top"><button class="check ${x.on ? 'on' : ''}" data-f="on">${x.on ? ico('check', 16, 3) : ''}</button><input type="text" data-f="merchant" value="${esc(x.merchant)}"></div>
        <div class="sms-grid">
          <input data-f="amount" inputmode="numeric" class="num" value="${x.amount.toLocaleString()}">
          <input data-f="date" type="date" value="${x.date}">
          <select data-f="category">${CATS[x.type].map(c => `<option ${c === x.category ? 'selected' : ''}>${c}</option>`).join('')}</select>
        </div>
        <div class="sms-tag ${x.type === 'income' ? 'pos' : 'sub'}">${x.type === 'income' ? '수입' : '지출'}${x.card ? ' · ' + esc(x.card) : ''}${x.dup ? ' · <span class="warn">이미 기록된 것 같아요</span>' : ''}${x.cancel ? ' · <span class="warn">취소 문자예요</span>' : ''}</div>
      </div>`).join('') + `<button class="btn pri block" id="smsSave" style="margin-top:14px" ${n ? '' : 'disabled'}>${n}건 기록하기</button>`;
    out.querySelector('#smsSave').onclick = () => {
      const list = items.filter(x => x.on && x.amount > 0);
      list.forEach((x, i) => {
        S.tx.unshift({ id: `t-${Date.now()}-${i}`, type: x.type, category: x.category, amount: x.amount, date: x.date, description: x.merchant || x.category, smsKey: `${x.date}|${x.amount}|${x.merchant}`, src: 'sms' });
        if (x.category !== x.guess && x.merchant) S.rules[ruleKey(x.merchant)] = x.category;
      });
      saveRules(); saveTx(); close(); render();
      toast(`${list.length}건 기록했어요`);
    };
  };
  const parse = () => {
    items = parseSms(inp.value).map(p => {
      const guess = guessCat(p.merchant, p.type);
      const dup = isDup(p);
      return { ...p, guess, category: guess, dup, on: !dup && !p.cancel };
    });
    draw();
  };
  inp.addEventListener('input', parse);
  out.addEventListener('click', (e) => {
    const b = e.target.closest('[data-f=on]'); if (!b) return;
    const x = items[+b.closest('[data-i]').dataset.i]; x.on = !x.on; draw();
  });
  out.addEventListener('change', (e) => {
    const f = e.target.dataset.f; if (!f || f === 'on') return;
    const x = items[+e.target.closest('[data-i]').dataset.i];
    if (f === 'amount') x.amount = digits(e.target.value);
    else x[f] = e.target.value;
    if (f === 'merchant') { x.guess = guessCat(x.merchant, x.type); }
  });
  body.querySelector('#smsClip').onclick = async () => {
    try { inp.value = await navigator.clipboard.readText(); parse(); if (!inp.value) toast('복사한 내용이 없어요'); }

const URL_RE = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
function payload() {
  return { app: APP, version: 3, exportedAt: new Date().toISOString(),

async function scriptCall(body, url = S.bk.url) {
  if (!url) throw new Error('백업 주소가 없어요');
  const res = await fetch(url, body ? { method: 'POST', body: JSON.stringify(body) } : undefined);
  const text = await res.text();
  let d; try { d = JSON.parse(text); } catch (e) { throw new Error('응답을 읽지 못했어요. 배포할 때 "모든 사용자"로 했는지 확인해 주세요'); }
  if (!d.ok) throw new Error(d.error || '스크립트가 실패했어요');
  return d;
}
let bkTimer = null, bkBusy = false, bkDirty = false;
const bkOn = () => S.bk.auto && !!S.bk.url;
function dirty() {
  bkDirty = true;
  if (!bkOn()) return;
  clearTimeout(bkTimer); bkTimer = setTimeout(() => runBackup(true), 60000);
}
async function runBackup(silent) {
  if (bkBusy) return;
  if (!S.bk.url) { if (!silent) { toast('먼저 백업 주소를 넣어 주세요'); S.tab = 'set'; render(); } return; }
  const p = payload();
  const h = hashStr(JSON.stringify(p.data));
  if (silent && h === S.bk.hash && !S.bk.lastErr) { bkDirty = false; return; }
  bkBusy = true; clearTimeout(bkTimer);
  if (!silent) toast('드라이브에 백업하는 중…', 8000);
  try {
    await scriptCall({ action: 'save', data: JSON.stringify(p) });
    Object.assign(S.bk, { lastAt: Date.now(), hash: h, lastErr: '' }); saveBk(); bkDirty = false;
    if (!silent) toast('드라이브에 백업했어요');
  } catch (e) {
    S.bk.lastErr = e.message; saveBk();
    if (!silent) toast('백업 실패: ' + e.message, 5000);
  } finally {
    bkBusy = false;
    if (!document.querySelector('.sheet-bg') && (S.tab === 'set' || S.tab === 'home')) render(); else renderBkBtn();
  }
}

/* ================= 데이터 바꾸기 (파일·드라이브 공통) ================= */
function applyData(parsed) {
  const d = parsed && (parsed.data || parsed);
  if (!d || (!Array.isArray(d.transactions) && !Array.isArray(d.fixedExpenses))) throw new Error('가계부 백업 형식이 아니에요');
  if (Array.isArray(d.transactions)) S.tx = d.transactions;
  if (Array.isArray(d.fixedExpenses)) S.fe = d.fixedExpenses;
  if (typeof d.monthlyBudget === 'number') S.budget = d.monthlyBudget;
  if (d.rules && typeof d.rules === 'object') S.rules = d.rules;
  if (d.settle && typeof d.settle === 'object') S.settle = Object.assign(S.settle, d.settle);
  saveTx(); saveFe(); saveBudget(); saveRules(); saveSettle(); render();
}

/* ================= 잠금 ================= */
function renderLock() {
  const el = $('lock');
  if (!S.locked) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const setting = !S.pw;
  const title = setting ? (S.setup === 2 ? '한 번 더 눌러 주세요' : '새 PIN 4자리를 정해 주세요') : 'PIN을 눌러 주세요';
  const desc = setting ? '가계부를 열 때 쓸 번호예요' : '젬의 스마트 가계부';
  el.innerHTML = `<img src="icon-192.png" alt=""><h2>${title}</h2><p>${desc}</p>
    <div class="dots" id="dots">${[0, 1, 2, 3].map(i => `<i class="${i < S.pin.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<span></span><button data-k="0">0</button><button data-k="back" aria-label="지우기" style="font-size:22px">⌫</button></div>
    ${setting ? `<button class="skip" data-k="skip">${S.oldPw ? '그만두기 (예전 PIN 유지)' : '나중에 할게요'}</button>` : ''}`;
}
function pinKey(k) {
  if (k === 'skip') {
    if (S.oldPw) { S.pw = S.oldPw; S.oldPw = ''; } else ls.set(K.pinSkip, '1');
    S.locked = false; S.pin = ''; S.setup = 0; renderLock(); render(); return;
  }
  if (k === 'back') { S.pin = S.pin.slice(0, -1); renderLock(); return; }
  if (S.pin.length >= 4) return;
  S.pin += k; renderLock();
  if (S.pin.length < 4) return;
  setTimeout(() => {
    const input = S.pin; S.pin = '';
    const shake = (msg) => { renderLock(); const d = $('dots'); if (d) d.classList.add('shake'); toast(msg); };
    if (S.pw) {
      if (input === S.pw) { S.locked = false; renderLock(); }
      else shake('번호가 달라요');
    } else if (S.setup !== 2) { S.tmpPin = input; S.setup = 2; renderLock(); }
    else if (input === S.tmpPin) {
      S.pw = input; S.oldPw = ''; ls.set(K.pw, input); ls.del(K.pinSkip); S.setup = 0; S.locked = false; renderLock(); toast('PIN을 정했어요'); render();
    } else { S.setup = 1; shake('번호가 달라요. 처음부터 다시 정해 주세요'); }
  }, 120);
}
$('lock').addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) pinKey(b.dataset.k); });
window.addEventListener('keydown', (e) => {
  if (!S.locked) return;
  if (e.key >= '0' && e.key <= '9') pinKey(e.key);
  else if (e.key === 'Backspace') pinKey('back');
});

  async install() { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; render(); },
  async resetAll() {
    if (!(await ask('전체 초기화', '모든 거래를 지우고 고정 지출을 처음 상태로 되돌려요. 되돌릴 수 없어요.', '초기화', true))) return;
    S.tx = []; S.fe = clone(DEFAULT_FIXED); S.budget = 0;
    saveTx(); saveFe(); saveBudget(); render(); toast('초기화했어요');
  }
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b, e);
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset.chg; if (!k) return;
  if (k === 'oneDay' || k === 'dlDay') {
    const v = parseInt(e.target.value, 10);
    if (!(v >= 1 && v <= 31)) { toast('1 ~ 31 사이로 넣어 주세요'); render(); return; }
    S.settle[k] = v; saveSettle(); toast('입금일을 바꿨어요');
  }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.chg === 'q') {
    S.q = e.target.value;
    const lb = $('listBody'); if (lb) lb.innerHTML = vListBody();
  }
  if (e.target.dataset.fmt === 'won') { const n = digits(e.target.value); e.target.value = n ? n.toLocaleString() : ''; }
});
document.addEventListener('focusout', (e) => { if (e.target.id === 'bkUrl') readUrlInput(); });

/* ================= 시작 ================= */
function init() {
  S.month = curMonth();
  S.locked = !!S.pw || ls.get(K.pinSkip, '') !== '1';
  S.setup = S.pw ? 0 : 1;
  render(); renderLock();
  // 하루에 한 번은 앱을 열 때 백업 (바뀐 게 없으면 건너뜀)
  if (bkOn() && Date.now() - (S.bk.lastAt || 0) > 20 * 3600000) setTimeout(() => runBackup(true), 3000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('pageshow', (e) => { if (e.persisted) render(); });
init();
</script>
</body>
